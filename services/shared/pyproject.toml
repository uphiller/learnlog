[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "board-common"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0,<6",
    "djangorestframework>=3.15",
    "PyJWT>=2.8",
    "cryptography>=42.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["board_common*"]
