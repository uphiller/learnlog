apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: board-platform
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: board-platform GitOps deployments
  sourceRepos:
    - https://github.com/uphiller/learnlog.git
  destinations:
    - namespace: board
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
