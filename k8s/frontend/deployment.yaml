apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: board
spec:
  selector:
    app: frontend
  ports:
    - port: 5173
      targetPort: 5173
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: board
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: board-platform-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5173
          env:
            - name: VITE_KEYCLOAK_URL
              value: https://auth.bettercodelab.com
            - name: VITE_KEYCLOAK_REALM
              value: board
            - name: VITE_KEYCLOAK_CLIENT_ID
              value: board-spa
            - name: VITE_API_BASE_URL
              value: https://log.bettercodelab.com/api
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 5173
            initialDelaySeconds: 5
            periodSeconds: 10
