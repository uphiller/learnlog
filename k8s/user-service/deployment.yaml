apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: board
spec:
  selector:
    app: user-service
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: board
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          env:
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_HOST
          command:
            - sh
            - -c
            - until nc -z "$POSTGRES_HOST" 5432; do sleep 2; done
      containers:
        - name: user-service
          image: board-platform-user-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DJANGO_DEBUG
              value: "true"
            - name: DJANGO_ALLOWED_HOSTS
              value: user-service,localhost,127.0.0.1,log.bettercodelab.com,board.bettercodelab.com
            - name: DJANGO_SECRET_KEY
              value: dev-secret-key
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_SSLMODE
              value: require
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_DB
            - name: POSTGRES_SCHEMA
              value: user
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: CORS_ALLOWED_ORIGINS
              value: https://log.bettercodelab.com,https://board.bettercodelab.com
            - name: KEYCLOAK_ISSUER
              value: https://auth.bettercodelab.com/realms/board
            - name: KEYCLOAK_JWKS_URL
              value: http://keycloak:8080/realms/board/protocol/openid-connect/certs
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: INTERNAL_API_KEY
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /api/health/
              port: 8000
              httpHeaders:
                - name: Host
                  value: user-service
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health/
              port: 8000
              httpHeaders:
                - name: Host
                  value: user-service
            initialDelaySeconds: 30
            periodSeconds: 30
